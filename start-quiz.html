<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinoyTrivia</title>
</head>
<body>
    <audio id="hover-sound" src="hover-effect.wav" preload="auto"></audio>
    <audio id="click-sound" src="click-effect.wav" preload="auto"></audio>

    <audio id="correct-sound" src="correct-effect.wav" preload="auto"></audio>
    <audio id="incorrect-sound" src="incorrect-effect.wav" preload="auto"></audio>
    <nav>
        <div class="div1"> 
            <h1 class="title">PinoyTrivia</h1>
        </div>
        <div class="mainnav">
            <ul>
                <li><a href="index.html" class="sound">Home</a></li>
                <li><a href="info.html" class="sound">Info</a></li>
                <li><a href="quiz.html" class="sound">Quizzes</a></li>
            </ul>
        </div>
    </nav>
<section>
    <div id="quiz-view" class="questions">
        <div id="progress" class="progress-text">Question 1 of 5</div>
        <h2 id="question" class="question-text">Loading question...</h2>
        <div id="options-box"></div>
        <p id="explanation" class="explantion-text"></p>

        <button id="next-button" class="next-button sound" onclick="moveToNext()"><span>Next</span></button>
        <button id="see-results-button" class="next-button sound hidden" onclick="showResults()"><span>See Results</span></button>
    </div>

    <div id="results-view" class="hidden center-text"> 
        <h2 class="results-title">Quiz Completed!</h2>
        <p id="score-summary"></p>
        <a href="quiz.html" class="back button sound"><span>Back to Quizzes</span></a>
    </div>

    <script src="scripts.js"></script>

</section>
